syntax = "proto3";

package shipping.v1;

enum ShippingZone {
  SHIPPING_ZONE_UNSPECIFIED = 0;
  LOCAL = 1;
  REGIONAL = 2;
  NATIONAL = 3;
}

enum ShippingMode {
  SHIPPING_MODE_UNSPECIFIED = 0;
  STANDARD = 1;
  EXPRESS = 2;
}

service ShippingService {
  rpc CalculateShipping(ShippingRequest) returns (ShippingResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ShippingRequest {
  string request_id = 1;
  int32 weight_grams = 2;
  ShippingZone zone = 3;
  ShippingMode mode = 4;
}

message ShippingResponse {
  string request_id = 1;
  int64 price_cents = 2;
  int32 estimated_days = 3;
  string server_team = 4;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string server_team = 2;
}
